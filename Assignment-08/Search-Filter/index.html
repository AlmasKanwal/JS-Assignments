<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopNexa | Smart Shopping</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">ShopNexa</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0"></ul>
        <form class="d-flex" role="search">
          <input class="form-control me-2" 
                 oninput="searchInput(this.value)" 
                 type="search" 
                 placeholder="Search products..." 
                 aria-label="Search" />
        </form>
      </div>
    </div>
  </nav>

  <!-- Filters -->
  <div class="container mt-4 text-center">
    <div class="row justify-content-center g-3">
      <div class="col-md-3">
        <select id="categoryFilter" class="form-select" onchange="filterByCategory(this.value)">
          <option value="">All Categories</option>
          <option value="cosmetic">Cosmetic</option>
          <option value="electronics">Electronics</option>
          <option value="sweet">Sweet</option>
        </select>
      </div>

      <div class="col-md-3">
        <select id="sortFilter" class="form-select" onchange="sortProducts(this.value)">
          <option value="">Sort by</option>
          <option value="asc">Title: A–Z</option>
          <option value="desc">Title: Z–A</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Product Grid -->
  <div id="productContainer" class="container mt-5 d-flex flex-wrap justify-content-center gap-4"></div>

  <!-- Footer -->
  <footer class="text-center mt-5 py-4 bg-light border-top">
    <p class="mb-0">© 2025 ShopEase | Crafted with ❤️ by RGM_Coders</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
