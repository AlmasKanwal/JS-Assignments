<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopNexa</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ==================== Navbar Start ==================== -->
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm sticky-top">
  <div class="container-xxl d-flex justify-content-between align-items-center">
    <a class="navbar-brand fw-bold" href="#">ShopNexa</a>

    <!-- Search form stays on the right side for all screen sizes -->
    <form class="d-flex" role="search">
      <input
        class="form-control no-focus-outline"
        oninput="searchInput(this.value)"
        type="search"
        placeholder="Search plants..."
        aria-label="Search"
      />
    </form>
  </div>
</nav>

  <!-- ==================== Navbar End ==================== -->


  <!-- ==================== Product Container Start ====================  -->
  <div id="productContainer" class="container-xxl mt-5 d-flex flex-wrap justify-content-center gap-4"></div>
  <!-- ==================== Product Container End ====================  -->


  <!-- ==================== Footer Start ====================  -->
  <footer class="text-center mt-5 py-4">
    <p class="mb-0">© 2025 ShopNexa | Crafted with ❤️ by Almas Kanwal</p>
  </footer>
  <!-- ==================== Footer End ====================  -->


  <!-- External JS -->
  <script src="./index.js"></script>
</body>
</html>
