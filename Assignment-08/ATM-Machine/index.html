<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXA PAY ATM</title>
  <!-- External Stylesheet -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- =========== ATM Machine Container Start =========== -->
  <div class="atm-container">
    <!-- Insert ATM Card -->
    <div class="card-slot" id="cardSlot">Insert Card</div>

    <!-- ATM Machine Screen -->
    <div class="screen" id="screen">
      <div>WELCOME TO NEXA PAY ATM</div>
      <div>Please insert your card...</div>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button class="action-btn green-btn" id="withdrawBtn">Withdraw</button>
      <button class="action-btn blue-btn" id="balanceBtn">Balance</button>
      <button class="action-btn yellow-btn" id="depositBtn">Deposit</button>
      <button class="action-btn red-btn" id="exitBtn">Exit</button>
    </div>

    <!-- Keypad Buttons -->
    <div class="keypad">
      <button class="key" value="1">1</button>
      <button class="key" value="2">2</button>
      <button class="key" value="3">3</button>
      <button class="key" value="4">4</button>
      <button class="key" value="5">5</button>
      <button class="key" value="6">6</button>
      <button class="key" value="7">7</button>
      <button class="key" value="8">8</button>
      <button class="key" value="9">9</button>
      <button class="key" id="clearBtn">CLR</button>
      <button class="key" value="0">0</button>
      <button class="key" id="enterBtn">ENT</button>
    </div>

  </div>
  <!-- =========== ATM Machine Container End =========== -->


  <!-- External JS -->
  <script src="./index.js"></script>
</body>
</html>
