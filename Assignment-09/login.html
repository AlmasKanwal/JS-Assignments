<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TasteHub | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to right, #ff9966, #ff5e62);
      font-family: 'Poppins', sans-serif;
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 15px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      text-align: center;
    }

    .login-box h2 {
      font-weight: 600;
      color: #ff5e62;
      margin-bottom: 20px;
    }

    .btn-login {
      background-color: #ff5e62;
      border: none;
      transition: 0.3s;
    }

    .btn-login:hover {
      background-color: #ff9966;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h2>Welcome to TasteHub</h2>
    <p class="text-muted">Login to explore delicious recipes</p>
    <input id="username" type="text" class="form-control mb-3" placeholder="Enter your name">
    <button class="btn btn-login text-white w-100">Login</button>
  </div>

  <script>
    document.querySelector(".btn-login").addEventListener("click", () => {
      const name = document.getElementById("username").value.trim();
      if (!name) {
        alert("Please enter your name!");
        return;
      }
      localStorage.setItem("tasteubUser", name);
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
