<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TasteHub</title>
    <!-- Google Fonts (Roboto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <!-- ========== Navbar Start ========== -->
    <nav>
        <h2>Tasteub</h2>
        <div>
            <span id="userWelcome"></span>
            <button class="btn btn-light btn-sm" onclick="logout()">Logout</button>
        </div>
    </nav>
    <!-- ========== Navbar End ========== -->


    <!-- ========== Filter Start ========== -->
    <div class="filters">
        <input id="searchInput" type="text" class="form-control" placeholder="Search recipes..."
            style="max-width: 250px;">
        <select id="categoryFilter" class="form-select" style="max-width: 180px;">
            <option value="all">All Cuisine</option>
        </select>
        <select id="sortFilter" class="form-select" style="max-width: 180px;">
            <option value="none">Sort By</option>
            <option value="asc">Prep Time (Low → High)</option>
            <option value="desc">Prep Time (High → Low)</option>
        </select>
    </div>
    <!-- ========== Filter End ========== -->


    <!-- ========== Product Container Start ========== -->
    <div id="recipeContainer" class="container-xxl d-flex justify-content-center gap-4 flex-wrap"></div>
    <!-- ========== Product Container End ========== -->


    <!-- External JS -->
    <script src="./index.js"></script>
</body>

</html>
